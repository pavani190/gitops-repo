apiVersion: apps/v1
kind: Deployment
metadata: { name: my-node-app }
spec:
  replicas: 2
  selector: { matchLabels: { app: my-node-app } }
  template:
    metadata: { labels: { app: my-node-app } }
    spec:
      containers:
      - name: my-node-app
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/my-node-app:REPLACE_ME
        ports: [{ containerPort: 3000 }]
